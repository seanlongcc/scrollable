name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  supabase-db:
    name: Supabase Local DB Tests
    runs-on: ubuntu-latest
    env:
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET: test-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm ci

      - name: Refuse remote Supabase credentials
        run: |
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -n "${SUPABASE_DB_URL:-}" ]; then
            echo "Refusing to run Supabase DB tests with remote credentials in CI."
            exit 1
          fi

      - name: Start local Supabase
        run: npm run supabase:start

      - name: Reset local database
        run: npm run supabase:reset

      - name: Run database tests
        run: npm run supabase:test

      - name: Stop local Supabase
        if: always()
        run: npm run supabase:stop || true

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_CHROMIUM_CHANNEL: chrome

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm ci

      - name: Verify Chrome for Playwright
        run: google-chrome --version

      - name: Start Next.js dev server
        run: |
          npm --workspace frontend run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/scrollable-next.log 2>&1 &
          echo "$!" > /tmp/scrollable-next.pid

          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          cat /tmp/scrollable-next.log
          exit 1

      - name: Run Playwright tests
        run: npm run e2e

      - name: Stop Next.js dev server
        if: always()
        run: |
          if [ -f /tmp/scrollable-next.pid ]; then
            kill "$(cat /tmp/scrollable-next.pid)" || true
          fi
