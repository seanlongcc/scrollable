name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_CLI_VERSION: 52.0.0

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  supabase-db:
    name: Supabase Local DB Tests
    runs-on: ubuntu-latest
    env:
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET: test-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Refuse remote Supabase credentials
        run: |
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -n "${SUPABASE_DB_URL:-}" ]; then
            echo "Refusing to run Supabase DB tests with remote credentials in CI."
            exit 1
          fi

      - name: Start local Supabase
        run: npm run supabase:start

      - name: Reset local database
        run: npm run supabase:reset

      - name: Run database tests
        run: npm run supabase:test

      - name: Stop local Supabase
        if: always()
        run: npm run supabase:stop || true

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npm --workspace frontend exec -- playwright install --with-deps chromium

      - name: Start Next.js dev server
        run: |
          npm --workspace frontend run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/scrollable-next.log 2>&1 &
          echo "$!" > /tmp/scrollable-next.pid

          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          cat /tmp/scrollable-next.log
          exit 1

      - name: Run Playwright tests
        run: npm run e2e

      - name: Stop Next.js dev server
        if: always()
        run: |
          if [ -f /tmp/scrollable-next.pid ]; then
            kill "$(cat /tmp/scrollable-next.pid)" || true
          fi

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs:
      - quality
      - supabase-db
      - e2e
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Check Vercel secrets
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"

      - name: Pull Vercel preview environment
        run: vercel pull --yes --environment=preview

      - name: Build Vercel preview artifact
        run: vercel build

      - name: Deploy Vercel preview artifact
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --archive=tgz)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "## Vercel Preview"
            echo ""
            echo "- URL: $url"
            echo "- Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs:
      - quality
      - supabase-db
      - e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Check Vercel secrets
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"

      - name: Pull Vercel production environment
        run: vercel pull --yes --environment=production

      - name: Build Vercel production artifact
        run: vercel build --prod

      - name: Deploy Vercel production artifact
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --prod --archive=tgz)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "## Vercel Production"
            echo ""
            echo "- URL: $url"
            echo "- Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
